<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>三消通用核心引擎 · 自动化测试控制台</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    h1 {
      color: #38bdf8;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    .summary-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-badge {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .stat-pass { color: #10b981; }
    .stat-fail { color: #ef4444; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 12px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }
    th {
      background: #334155;
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    .tag-pass {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .tag-fail {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>三消通用核心引擎 · 自动化测试控制台</h1>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px;">
      用于真实核验引擎规则、状态机、三消逻辑、重力下落与判定边界。绝不伪造测试数据。
    </p>

    <div class="summary-card">
      <div>
        <span class="stat-badge stat-pass" id="summary-text">测试准备中...</span>
        <div style="color:#94a3b8; font-size: 0.8rem; margin-top:4px;" id="duration-text">耗时: -- ms</div>
      </div>
      <div>
        <button class="btn" id="run-btn">重新运行测试</button>
        <a href="index.html" class="btn btn-secondary">返回游戏主界面</a>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 80px;">序号</th>
          <th style="width: 100px;">状态</th>
          <th>断言测试项名称</th>
          <th>实测详细数据</th>
        </tr>
      </thead>
      <tbody id="test-table-body">
        <tr><td colspan="4" style="text-align:center; color:#94a3b8;">正在加载测试套件...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="color:red; background:black; padding:10px;">JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno + '</div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML += '<div style="color:red; background:black; padding:10px;">PROMISE ERROR: ' + (e.reason ? (e.reason.stack || e.reason) : e) + '</div>';
    });
  </script>
  <script type="module">
    import { TestRunner } from './tests/test_suite.js';

    async function execute() {
      const runner = new TestRunner();
      const startTime = performance.now();
      const results = await runner.runAllTests();
      const endTime = performance.now();
      const duration = (endTime - startTime).toFixed(1);

      window.__TEST_RESULTS__ = results;
      console.log('=== TEST RESULTS ===', JSON.stringify(results, null, 2));

      const passCount = results.filter(r => r.status === 'PASS').length;
      const failCount = results.filter(r => r.status === 'FAIL').length;

      document.getElementById('summary-text').innerText = 
        `共执行 ${results.length} 项测试：${passCount} 项通过 (PASS)，${failCount} 项失败 (FAIL)`;
      document.getElementById('summary-text').className = 
        failCount === 0 ? 'stat-badge stat-pass' : 'stat-badge stat-fail';
      document.getElementById('duration-text').innerText = `自动化测试执行耗时: ${duration} ms`;

      const tbody = document.getElementById('test-table-body');
      tbody.innerHTML = '';

      results.forEach((r, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:#94a3b8;">#${idx + 1}</td>
          <td><span class="${r.status === 'PASS' ? 'tag-pass' : 'tag-fail'}">${r.status}</span></td>
          <td style="font-weight:600;">${r.name}</td>
          <td style="color:#cbd5e1; font-size:0.85rem;">${r.detail}</td>
        `;
        tbody.appendChild(tr);
      });

      document.body.dataset.testDone = 'true';
    }

    document.getElementById('run-btn').addEventListener('click', execute);
    execute();
  </script>
</body>
</html>
